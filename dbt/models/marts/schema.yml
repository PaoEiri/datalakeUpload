version: 2

models:
  - name: fact_precio_vivienda
    description: "Precio €/m² (Tinsa) por tiempo y geografía - lista para Power BI"
    config:
      contract:
        enforced: true
    constraints:
      - type: unique
        columns: [id_tiempo, id_geografia]
    columns:
      - name: id_tiempo
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_tiempo')
            to_columns: [id_tiempo]
        tests:
          - not_null
          - relationships:
              to: ref('dim_tiempo')
              field: id_tiempo
      - name: id_geografia
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_geografia')
            to_columns: [id_geografia]
        tests:
          - not_null
          - relationships:
              to: ref('dim_geografia')
              field: id_geografia
      - name: precio_m2
        data_type: numeric(18,4)
        description: "Precio medio €/m²"

  - name: fact_transacciones_inmobiliarias
    description: "Número de transacciones inmobiliarias por tiempo, geografía (municipio) y tipo de vivienda - lista para Power BI"
    config:
      contract:
        enforced: true
    constraints:
      - type: unique
        columns: [id_tiempo, id_geografia, id_tipo_vivienda]
    columns:
      - name: id_tiempo
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_tiempo')
            to_columns: [id_tiempo]
        tests:
          - not_null
          - relationships:
              to: ref('dim_tiempo')
              field: id_tiempo
      - name: id_geografia
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_geografia')
            to_columns: [id_geografia]
        tests:
          - not_null
          - relationships:
              to: ref('dim_geografia')
              field: id_geografia
      - name: id_tipo_vivienda
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_tipo_vivienda')
            to_columns: [id_tipo_vivienda]
        tests:
          - not_null
          - relationships:
              to: ref('dim_tipo_vivienda')
              field: id_tipo_vivienda
      - name: num_transacciones
        data_type: integer
        description: "Número de transacciones inmobiliarias"

  - name: fact_indicadores_anuales
    description: "Indicadores socioeconómicos del INE por tiempo (anual), geografía e indicador - lista para Power BI"
    config:
      contract:
        enforced: true
    constraints:
      - type: unique
        columns: [id_tiempo, id_geografia, id_indicador]
    columns:
      - name: id_tiempo
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_tiempo')
            to_columns: [id_tiempo]
        tests:
          - not_null
          - relationships:
              to: ref('dim_tiempo')
              field: id_tiempo
      - name: id_geografia
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_geografia')
            to_columns: [id_geografia]
        tests:
          - not_null
          - relationships:
              to: ref('dim_geografia')
              field: id_geografia
      - name: id_indicador
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_indicador')
            to_columns: [id_indicador]
        tests:
          - not_null
          - relationships:
              to: ref('dim_indicador')
              field: id_indicador
      - name: valor
        data_type: numeric(18,4)
        description: "Valor del indicador"

  - name: fact_predicciones
    description: "Predicciones del modelo champion de precio_m2 por tiempo, geografía y modelo - lista para Power BI"
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [id_prediccion]
    columns:
      - name: id_tiempo
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_tiempo')
            to_columns: [id_tiempo]
        tests:
          - not_null
          - relationships:
              to: ref('dim_tiempo')
              field: id_tiempo
      - name: id_geografia
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_geografia')
            to_columns: [id_geografia]
        tests:
          - not_null
          - relationships:
              to: ref('dim_geografia')
              field: id_geografia
      - name: id_modelo
        data_type: integer
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_modelo')
            to_columns: [id_modelo]
        tests:
          - not_null
          - relationships:
              to: ref('dim_modelo')
              field: id_modelo
      - name: id_prediccion
        data_type: integer
        constraints:
          - type: not_null
        tests: [not_null, unique]
      - name: precio_predicho
        data_type: numeric(18,4)
        description: "Precio €/m² predicho (backtesting o forecast, ver es_forecast)"
      - name: intervalo_inferior
        data_type: numeric(18,4)
      - name: intervalo_superior
        data_type: numeric(18,4)
      - name: es_forecast
        data_type: boolean
      - name: creado_en
        data_type: timestamp without time zone
